<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ôn luyện Vật lí 12</title>
  <style>
    :root{--ink:#172033;--muted:#637085;--paper:#f7f9fc;--card:#fff;--brand:#155eef;--line:#dbe3ef;--good:#087443;--bad:#b42318;--soft:#eaf1ff}
    *{box-sizing:border-box} body{margin:0;font:16px/1.55 Arial,sans-serif;color:var(--ink);background:var(--paper)}
    header{background:linear-gradient(125deg,#123a84,#155eef);color:white;padding:42px 20px 36px}.wrap{max-width:960px;margin:auto}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)} header p{margin:6px 0 0;opacity:.9}
    main{padding:26px 20px 54px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tab,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 16px;background:#fff;color:var(--ink);cursor:pointer}.tab[aria-selected="true"],.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
    .panel{display:none}.panel.active{display:block}.intro,.question,.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 2px 10px #1d35570a}.question h2{font-size:1.05rem;margin:0 0 12px}.number{color:var(--brand);font-weight:bold}
    label.option,label.statement{display:block;padding:10px 12px;margin:7px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}.option:hover,.statement:hover{background:#f6f8fc}input{accent-color:var(--brand);margin-right:9px}.tf-grid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}.tf-choice{display:flex;gap:10px}.tf-choice label{white-space:nowrap}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.secondary{background:#fff}.result{display:none}.result.show{display:block}.score{font-size:1.35rem;font-weight:bold;margin:0 0 8px}.correct{border-color:#8ed8b3;background:#effcf5}.incorrect{border-color:#f0aaa5;background:#fff5f4}.answer-note{margin-top:9px;color:var(--muted);font-size:.94rem}.correct .answer-note{color:var(--good)}.incorrect .answer-note{color:var(--bad)}
    .progress{height:10px;border-radius:99px;background:#e8edf5;overflow:hidden;margin:12px 0 3px}.progress b{display:block;height:100%;background:var(--brand);transition:width .2s}.small{color:var(--muted);font-size:.92rem}.hidden{display:none}@media(max-width:560px){main{padding:18px 12px}.question,.intro,.result{padding:16px}.tf-grid{grid-template-columns:1fr}.tf-choice{padding-left:2px}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>Ôn luyện Vật lí 12</h1><p>Giữa kì 1 · Trắc nghiệm và đúng sai · Làm bài và chấm điểm ngay</p></div></header>
<main class="wrap">
  <div class="tabs" role="tablist" aria-label="Chọn dạng bài">
    <button class="tab" id="mcq-tab" role="tab" aria-selected="true" aria-controls="mcq">Trắc nghiệm 25 câu</button>
    <button class="tab" id="tf-tab" role="tab" aria-selected="false" aria-controls="tf">Đúng sai 5 câu</button>
  </div>
  <section id="mcq" class="panel active" role="tabpanel" aria-labelledby="mcq-tab">
    <div class="intro"><strong>Phần A.</strong> Chọn một đáp án đúng cho mỗi câu. Bạn có thể chấm điểm bất cứ lúc nào.</div>
    <form id="mcq-form"></form><div class="actions"><button class="primary" id="grade-mcq" type="button">Chấm điểm phần A</button><button class="secondary" id="reset-mcq" type="button">Làm lại</button></div><div id="mcq-result" class="result" aria-live="polite"></div>
  </section>
  <section id="tf" class="panel" role="tabpanel" aria-labelledby="tf-tab">
    <div class="intro"><strong>Phần B.</strong> Với mỗi phát biểu, chọn Đúng hoặc Sai.</div>
    <form id="tf-form"></form><div class="actions"><button class="primary" id="grade-tf" type="button">Chấm điểm phần B</button><button class="secondary" id="reset-tf" type="button">Làm lại</button></div><div id="tf-result" class="result" aria-live="polite"></div>
  </section>
</main>
<script>
const mcq=[
['Trong chất rắn, các phân tử thường','chuyển động hỗn loạn khắp bình chứa.','dao động quanh vị trí cân bằng xác định.','đứng yên hoàn toàn.','ở rất xa nhau.',1],
['Tính chất nào là đặc trưng của chất khí?','Có hình dạng và thể tích riêng.','Có thể tích riêng nhưng không có hình dạng riêng.','Không có hình dạng và thể tích riêng, dễ nén.','Các phân tử chỉ dao động quanh vị trí cân bằng.',2],
['Hiện tượng nào là sự bay hơi?','Nước đá tan thành nước.','Hơi nước đọng thành giọt trên thành cốc lạnh.','Quần áo ướt khô dần khi phơi.','Nước sôi tạo bọt khí.',2],
['Sự thăng hoa là quá trình chuyển thể','từ rắn sang khí.','từ khí sang rắn.','từ lỏng sang khí.','từ khí sang lỏng.',0],
['Ở áp suất xác định, trong khi một chất rắn kết tinh đang nóng chảy, đại lượng nào không đổi?','Nội năng.','Nhiệt độ.','Thể tích.','Khối lượng riêng.',1],
['Nhiệt độ 27 °C tương ứng gần đúng với','246 K.','273 K.','300 K.','310 K.',2],
['Điểm đóng băng và điểm sôi của nước ở áp suất chuẩn theo thang Kelvin lần lượt là','0 K và 100 K.','273 K và 373 K.','32 K và 212 K.','273 K và 100 K.',1],
['Nhiệt dung riêng của một chất cho biết','nhiệt lượng để 1 kg chất nóng chảy.','nhiệt lượng để 1 kg chất tăng thêm 1 K.','nhiệt lượng để toàn bộ chất sôi.','nhiệt độ nóng chảy của chất.',1],
['Đơn vị SI của nhiệt dung riêng là','J/kg.','J/K.','J/(kg.K).','kg.J/K.',2],
['Một vật khối lượng m, nhiệt dung riêng c tăng nhiệt độ từ t1 đến t2. Nhiệt lượng vật thu vào là','Q = mc(t2 - t1).','Q = mc(t2 + t1).','Q = m/c(t2 - t1).','Q = mc/(t2 - t1).',0],
['Nếu hai vật có cùng khối lượng và cùng tăng nhiệt độ 1 K thì vật có nhiệt dung riêng lớn hơn sẽ','thu nhiệt lượng lớn hơn.','thu nhiệt lượng nhỏ hơn.','thu nhiệt lượng bằng nhau.','không thu nhiệt lượng.',0],
['Nhiệt lượng cần để làm nóng chảy hoàn toàn khối lượng m của chất ở nhiệt độ nóng chảy là','Q = mcΔt.','Q = mλ.','Q = mL.','Q = λ/m.',1],
['Đơn vị của nhiệt nóng chảy riêng λ là','J.','J/kg.','J/(kg.K).','kg/J.',1],
['Khi đúc tượng đồng, đồng được nung chảy rồi để nguội trong khuôn. Hai quá trình chuyển thể là','nóng chảy và đông đặc.','bay hơi và ngưng tụ.','thăng hoa và ngưng kết.','nóng chảy và bay hơi.',0],
['Nhiệt hóa hơi riêng L của nước có ý nghĩa là','nhiệt lượng cần để 1 kg nước tăng 1 K.','nhiệt lượng cần để 1 kg nước hóa hơi hoàn toàn ở nhiệt độ sôi.','nhiệt lượng tỏa ra khi 1 kg nước tăng nhiệt độ.','nhiệt lượng cần để làm tan 1 kg nước đá.',1],
['Đơn vị của nhiệt hóa hơi riêng là','J/kg.','J.','J/(kg.K).','K/J.',0],
['Theo quy ước ΔU = A + Q, khi khí nhận nhiệt và đồng thời nở ra sinh công thì','Q > 0, A > 0.','Q < 0, A < 0.','Q > 0, A < 0.','Q < 0, A > 0.',2],
['Một khí nhận nhiệt lượng 200 J và nhận công 50 J. Độ biến thiên nội năng của khí là','150 J.','200 J.','250 J.','-250 J.',2],
['Một khí nhận nhiệt lượng 500 J và sinh công 200 J. Độ biến thiên nội năng của khí là','700 J.','300 J.','-300 J.','-700 J.',1],
['Một khối đồng 2 kg, c = 380 J/(kg.K), tăng nhiệt độ 10 °C. Nhiệt lượng khối đồng thu vào là','760 J.','3 800 J.','7 600 J.','76 000 J.',2],
['Cần bao nhiêu nhiệt lượng để hóa hơi hoàn toàn 0,20 kg nước ở 100 °C? Cho L = 2,3 × 10⁶ J/kg.','46 kJ.','230 kJ.','460 kJ.','2 300 kJ.',2],
['Một vật có khối lượng 0,5 kg, c = 400 J/(kg.K), nhận 10 000 J. Nhiệt độ của vật tăng thêm','5 °C.','20 °C.','50 °C.','80 °C.',2],
['Một lượng nước 1 kg được đun từ 20 °C lên 30 °C. Lấy c = 4200 J/(kg.K). Nhiệt lượng nước thu vào là','4 200 J.','21 000 J.','42 000 J.','126 000 J.',2],
['Quá trình nào làm nội năng của một vật tăng chủ yếu do thực hiện công?','Đun nóng nước bằng bếp.','Nén nhanh không khí trong bơm xe.','Để nước nóng nguội đi.','Nước đá tan trong cốc.',1],
['Trong nguyên lí I nhiệt động lực học, Q < 0 cho biết','hệ nhận nhiệt.','hệ truyền nhiệt ra môi trường.','hệ nhận công.','hệ sinh công.',1]
];
const tf=[
['Cấu trúc chất và chuyển thể',['Chất lỏng có thể tích riêng nhưng không có hình dạng riêng.',true],['Chất khí rất khó bị nén vì các phân tử ở sát nhau.',false],['Trong quá trình đông đặc của chất tinh khiết, nhiệt độ không đổi.',true],['Bay hơi chỉ xảy ra ở nhiệt độ sôi.',false]],
['Nhiệt độ và nhiệt dung riêng',['Nhiệt độ 0 °C tương ứng 273 K.',true],['Khi đổi độ chênh nhiệt độ từ °C sang K thì giá trị độ chênh không đổi.',true],['Nhiệt dung riêng phụ thuộc vào khối lượng của vật.',false],['Nếu Q = mcΔt thì khi vật tỏa nhiệt, Q có thể mang giá trị âm theo quy ước dấu.',true]],
['Nóng chảy và hóa hơi',['Công thức tính nhiệt lượng nóng chảy là Q = mλ.',true],['Nhiệt nóng chảy riêng có đơn vị J/(kg.K).',false],['Để hóa hơi hoàn toàn 1 kg nước ở nhiệt độ sôi cần nhiệt lượng Q = L.',true],['Khi nước đang sôi ở áp suất không đổi, cung cấp nhiệt làm nhiệt độ nước tiếp tục tăng nhanh.',false]],
['Nguyên lí I nhiệt động lực học',['Theo ΔU = A + Q, nếu khí nhận công thì A > 0.',true],['Khí nhận nhiệt thì luôn có nội năng tăng.',false],['Nếu khí nhận 100 J nhiệt lượng và sinh công 40 J thì ΔU = 60 J.',true],['Nếu khí truyền nhiệt ra ngoài và nhận công, Q < 0 và A > 0.',true]],
['Bài tập tổng hợp',['0,5 kg nhôm có c = 900 J/(kg.K) tăng 20 °C thì thu 9 000 J nhiệt lượng.',true],['0,1 kg nước hóa hơi hoàn toàn với L = 2,3 × 10⁶ J/kg cần 23 000 J.',false],['1 kg nước tăng 5 °C với c = 4200 J/(kg.K) cần 21 000 J.',true],['Một khí nhận Q = 120 J và nhận A = 80 J thì nội năng giảm 200 J.',false]]
];
const letters=['A','B','C','D'];
const mcqForm=document.querySelector('#mcq-form'), tfForm=document.querySelector('#tf-form');
mcq.forEach((q,i)=>{mcqForm.insertAdjacentHTML('beforeend',`<article class="question" id="mq${i}"><h2><span class="number">Câu ${i+1}.</span> ${q[0]}</h2>${q.slice(1,5).map((x,j)=>`<label class="option"><input type="radio" name="m${i}" value="${j}"> <b>${letters[j]}.</b> ${x}</label>`).join('')}<div class="answer-note hidden"></div></article>`)});
tf.forEach((set,i)=>{let rows=set.slice(1).map((s,j)=>`<div class="tf-grid statement" data-q="${i}-${j}"><div><b>${String.fromCharCode(97+j)}.</b> ${s[0]}<div class="answer-note hidden"></div></div><div class="tf-choice"><label><input type="radio" name="t${i}-${j}" value="true"> Đúng</label><label><input type="radio" name="t${i}-${j}" value="false"> Sai</label></div></div>`).join('');tfForm.insertAdjacentHTML('beforeend',`<article class="question"><h2><span class="number">Câu ${i+1}.</span> ${set[0]}</h2>${rows}</article>`)});
function gradeMCQ(){let score=0,done=0;mcq.forEach((q,i)=>{let card=document.querySelector('#mq'+i),chosen=document.querySelector(`input[name="m${i}"]:checked`),note=card.querySelector('.answer-note');card.classList.remove('correct','incorrect');note.classList.remove('hidden');if(chosen){done++;if(+chosen.value===q[5]){score++;card.classList.add('correct');note.textContent='Đúng.'}else{card.classList.add('incorrect');note.textContent=`Đáp án đúng: ${letters[q[5]]}. ${q[q[5]+1]}`}}else{card.classList.add('incorrect');note.textContent=`Chưa chọn. Đáp án đúng: ${letters[q[5]]}. ${q[q[5]+1]}`}});showResult('mcq-result',score,mcq.length,done)}
function gradeTF(){let score=0,done=0,total=0;tf.forEach((set,i)=>set.slice(1).forEach((s,j)=>{total++;let row=document.querySelector(`[data-q="${i}-${j}"]`),chosen=document.querySelector(`input[name="t${i}-${j}"]:checked`),note=row.querySelector('.answer-note');row.classList.remove('correct','incorrect');note.classList.remove('hidden');if(chosen){done++;if((chosen.value==='true')===s[1]){score++;row.classList.add('correct');note.textContent='Đúng.'}else{row.classList.add('incorrect');note.textContent=`Đáp án: ${s[1]?'Đúng':'Sai'}.`}}else{row.classList.add('incorrect');note.textContent=`Chưa chọn. Đáp án: ${s[1]?'Đúng':'Sai'}.`}}));showResult('tf-result',score,total,done)}
function showResult(id,score,total,done){let percent=Math.round(score/total*100),box=document.querySelector('#'+id);box.innerHTML=`<p class="score">Kết quả: ${score}/${total} (${percent}%)</p><div class="progress"><b style="width:${percent}%"></b></div><p class="small">Đã trả lời ${done}/${total} câu.</p>`;box.classList.add('show');box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function reset(id){document.querySelector('#'+id).reset();document.querySelectorAll(id==='mcq-form'?'#mcq-form .question':'#tf-form .statement').forEach(x=>{x.classList.remove('correct','incorrect');x.querySelector('.answer-note').classList.add('hidden')});let out=document.querySelector(id==='mcq-form'?'#mcq-result':'#tf-result');out.classList.remove('show');out.innerHTML=''}
document.querySelector('#grade-mcq').onclick=gradeMCQ;document.querySelector('#grade-tf').onclick=gradeTF;document.querySelector('#reset-mcq').onclick=()=>reset('mcq-form');document.querySelector('#reset-tf').onclick=()=>reset('tf-form');
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected','false'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));tab.setAttribute('aria-selected','true');document.querySelector('#'+tab.getAttribute('aria-controls')).classList.add('active')});
</script>
</body></html>
